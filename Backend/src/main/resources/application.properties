# ===================================================================
# Pragati University Canteen Order App
# Master Application Configuration
# ===================================================================

# Application Metadata
spring.application.name=pragati-canteen
server.port=8080
server.servlet.context-path=/

# Active Spring Profile (default: dev)
spring.profiles.active=dev

# -------------------------------------------------------------------
# MySQL 8.0 DataSource Configuration (Environment variables with safe defaults)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pragati_canteen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Naveen@9705}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# HikariCP Connection Pool Settings
# -------------------------------------------------------------------
spring.datasource.hikari.pool-name=PragatiCanteenHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000
# Graceful boot when MySQL is offline during initial service testing
spring.datasource.hikari.initialization-fail-timeout=-1

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Spring Boot Actuator Endpoints
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# -------------------------------------------------------------------
# Food Image Upload Configuration
# -------------------------------------------------------------------
canteen.upload.dir=./uploads/foods
canteen.upload.url-prefix=/uploads/foods/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

